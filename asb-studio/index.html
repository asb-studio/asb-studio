<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="paper">

<!--
  THE STUDIO.
  This file must sit at the ROOT of asb-studio/, next to serve.py.
  Stylesheet and script paths are relative to that location, so moving it
  into a subfolder silently breaks every one of them.
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>استودیوی اسب</title>

  <!-- Vazirmatn is only the fallback. The house face is Arad, loaded from
       webfonts/Arad-VF.woff2 by tokens.css. -->
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/sidebar.css">
  <link rel="stylesheet" href="src/styles/panel.css">
  <link rel="stylesheet" href="src/styles/tabs.css">
  <link rel="stylesheet" href="src/styles/menubar.css">
  <link rel="stylesheet" href="src/styles/preview.css">
  <link rel="stylesheet" href="src/styles/dialog.css">

  <!-- Applied before first paint so a dark-mode author never sees a white
       flash on load. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('asb-studio:theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'paper');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* private mode: the light default stands */ }
    })();
  </script>
</head>

<body>
  <div class="app">

    <!-- ================================================================
         Title bar: who we are, which file is open, and what to do with it
         ================================================================ -->
    <header class="titlebar">
      <div class="titlebar__actions">
        <button class="btn" id="btn-open" data-tip="باز کردن فایل (Ctrl+O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          باز کردن
        </button>
        <button class="btn btn--primary" id="btn-save" data-tip="ذخیره روی همین فایل (Ctrl+S)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
          ذخیره
        </button>
        <button class="btn btn--quiet" id="btn-saveas" data-tip="ذخیره با نام تازه (Ctrl+Shift+S)">با نام…</button>
      </div>

      <!-- Absolutely centred, so it stays put as the two button clusters
           change width. -->
      <div class="brand">
        <span class="brand__mark" data-logo aria-hidden="true"></span>
        <span class="brand__name">استودیوی اسب</span>
      </div>

    </header>

    <!-- ================================================================
         Menu bar. Every command lives here, at every window width. A toolbar
         can run out of room; a menu cannot.
         ================================================================ -->
    <nav class="menubar" id="menubar" aria-label="منوها"></nav>

    <!-- ================================================================
         Open documents. The file name lives here, not in the title bar.
         ================================================================ -->
    <div class="tabstrip" id="tabstrip" role="tablist" aria-label="سندهای باز"></div>

    <!-- ================================================================
         Toolbar: the frequent tools as icons. Whatever does not fit moves
         into the ⋮ button rather than sliding off the edge. See ui/toolbar.js.
         ================================================================ -->
    <div class="toolbar" id="toolbar" role="toolbar" aria-label="ابزارها"></div>

    <!-- ================================================================
         The two panes. In this right-to-left grid the first column is the
         rightmost one, so the preview sits on the right and the Markdown
         source on the left. Frontmatter lives in the publish panel below.
         ================================================================ -->
    <div class="split" id="split">
      <section class="pane pane--preview">
          <div class="pane__head">پیش‌نمایش — همان چیزی که سایت می‌سازد</div>
          <div class="pane__body">
            <article class="preview" id="preview"></article>
          </div>
        </section>

      <div class="gutter" id="gutter" role="separator" aria-orientation="vertical" aria-label="تغییر عرض ستون‌ها"></div>

      <section class="pane pane--source">
          <div class="pane__head">
            <span>متن مارک‌دان</span>
            <span class="spacer"></span>
            <span id="fm-count">۰ فیلد</span>
          </div>
          <div class="pane__body" id="editor"></div>
        </section>
    </div>

    <!-- ================================================================
         Issues drawer, hidden until asked for
         ================================================================ -->
    <div class="issues" id="issues" hidden>
      <div class="issues__head">
        <span>چیزهایی که در سایت درست درنمی‌آیند</span>
        <span class="spacer"></span>
        <button class="btn btn--quiet" id="btn-issues-close">بستن (Esc)</button>
      </div>
      <div id="issue-list"></div>
    </div>

    <!-- ================================================================
         Review drawer: every tracked change, with accept and reject.
         ================================================================ -->
    <div class="review-drawer" id="review" hidden>
      <div class="fn-head">
        <span>تغییرهای ردیابی‌شده</span>
        <span id="review-summary" class="status--ok"></span>
        <span class="spacer"></span>
        <button class="btn btn--quiet" id="btn-review-accept-all">پذیرفتن همه</button>
        <button class="btn btn--quiet" id="btn-review-reject-all">رد کردن همه</button>
        <button class="btn btn--quiet" id="btn-review-close">بستن</button>
      </div>
      <div class="rv-list" id="review-list"></div>
    </div>

    <!-- ================================================================
         Footnote drawer. At the foot of the window, the way notes sit at
         the foot of a page.
         ================================================================ -->
    <div class="footnotes-drawer" id="footnotes" hidden>
      <div class="fn-head">
        <span>پانویس‌ها</span>
        <span id="footnote-summary" class="status--ok"></span>
        <span class="spacer"></span>
        <button class="btn btn--quiet" id="btn-footnote-renumber"
          data-tip="شماره‌ها را با ترتیب متن هماهنگ کن">مرتب کردن شماره‌ها</button>
        <button class="btn btn--quiet" id="btn-footnote-close">بستن</button>
      </div>
      <div class="fn-list" id="footnote-list"></div>
    </div>

    <footer class="statusbar">
      <span id="wordcount">۰ کلمه</span>
      <span id="cursor">خط ۱ از ۱ · ستون ۱</span>
      <span id="ids-status" class="status--ok">همه‌ی پاراگراف‌ها شناسه دارند</span>
      <button id="btn-stats" data-tip="آمار ویراستاری این متن">آمار متن</button>
      <button id="btn-usage" data-tip="کارنامه‌ی کار تو در این مرورگر">کارنامه</button>
      <button id="btn-footnotes" aria-pressed="false" data-tip="پانل پانویس‌ها (Ctrl+Shift+F)">پانویس‌ها</button>
      <button id="btn-review" aria-pressed="false" data-tip="تغییرهای ردیابی‌شده (Ctrl+Shift+R)">تغییرها</button>
      <span class="spacer"></span>
      <button id="btn-ready" class="status--ok">آماده‌ی انتشار</button>
      <span id="lint-status" class="status--ok">بدون ایراد</span>
      <button id="btn-issues" aria-pressed="false">فهرست ایرادها (<span id="issue-count">۰</span>)</button>
    </footer>

  </div>

  <!-- ================================================================
       Publish panel. Holds the frontmatter form and the readiness report,
       and slides in over the text only when it is asked for.
       ================================================================ -->
  <div class="panel-scrim" id="panel-scrim"></div>
  <aside class="panel" id="panel" aria-label="شناسنامه و انتشار" aria-hidden="true">
    <header class="panel__head">
      <h2>آماده‌ی انتشار</h2>
      <span class="spacer"></span>
      <button class="btn btn--quiet" id="btn-panel-close" data-tip="بستن (Esc)">بستن</button>
    </header>
    <div class="panel__body">
      <div id="ready"></div>
      <div id="sidebar"></div>
    </div>
    <footer class="panel__foot">
      <button class="btn btn--outline" id="btn-panel-saveas">ذخیره با نام…</button>
      <button class="btn btn--primary" id="btn-panel-save">ذخیره و بستن</button>
    </footer>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="src/main.js"></script>
</body>

</html>
