<!--
  Supabase → Authentication → Emails → Magic link or OTP
  Paste this into the Body field. Requires custom SMTP to be enabled - see SMTP.md.

  CODE ONLY. NO LINK, AND THAT IS DELIBERATE.

  A sign-in link and a sign-in code are the same one-time token. Mail providers
  and security scanners follow links in incoming mail to check them, and doing
  so SPENDS the token - so by the time the code is typed it has already been
  used, and Supabase answers otp_expired. That is the "the code is invalid but
  I seem to be signed in anyway" behaviour: the scanner's visit created the
  session, and the person's own attempt then failed.

  Removing the link removes the problem. The code cannot be spent by anything
  that merely reads the message.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#e7e0cf;padding:32px 16px;font-family:Tahoma,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             dir="rtl" style="max-width:480px;background:#fdf9ee;border:1px solid #d5ccb4;
                              border-radius:10px;overflow:hidden;">

        <tr>
          <td align="center" style="padding:34px 30px 8px;">
            <div style="font-size:19px;font-weight:bold;color:#3a352c;">استودیوی اسب</div>
            <div style="width:44px;height:1px;background:#d5ccb4;margin:14px auto 0;"></div>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding:22px 30px 6px;color:#3a352c;font-size:15px;line-height:2;">
            این کد را در استودیو بنویس:
          </td>
        </tr>

        <tr>
          <td align="center" style="padding:6px 30px 26px;">
            <div style="display:inline-block;background:#f5f0e2;border:1px solid #d5ccb4;
                        border-radius:8px;padding:12px 26px;font-family:monospace;
                        font-size:24px;font-weight:bold;letter-spacing:7px;
                        color:#3a352c;direction:ltr;">{{ .Token }}</div>
          </td>
        </tr>

        <tr>
          <td style="padding:16px 30px;background:#f5f0e2;border-top:1px solid #e5dcc6;
                     color:#6b6354;font-size:12px;line-height:1.9;">
            این کد یک‌بارمصرف است و به‌زودی منقضی می‌شود. اگر تو درخواستش نکرده‌ای، نادیده‌اش بگیر.
          </td>
        </tr>

      </table>

      <div style="max-width:480px;margin:14px auto 0;color:#6b6354;font-size:11px;">نشر اسب</div>
    </td>
  </tr>
</table>
